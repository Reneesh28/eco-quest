<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz Results & Performance Review - EcoQuest">
    <title>Quiz Results - EcoQuest</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="results">
    <div class="app-container">
        <!-- Sidebar Placeholder -->
        <aside id="sidebar" class="sidebar" aria-label="Main sidebar navigation"></aside>

        <!-- Mobile Drawer Backdrop Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Header Placeholder -->
            <header id="header" class="top-header" role="banner"></header>

            <main class="content-body" id="mainContent">
                <!-- Content will be injected dynamically by EcoResultsController -->
                <div class="empty-result-state">
                    <p class="body-text text-muted">Loading quiz summary...</p>
                </div>
            </main>

            <!-- Footer Placeholder -->
            <footer id="footer" class="site-footer" role="contentinfo"></footer>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/gamification.js"></script>
    <script src="js/challengeData.js"></script>
    <script src="js/challenges.js"></script>
    <script src="js/data.js"></script>
    <script src="js/results.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.EcoResultsController) {
                window.EcoResultsController.init();
            }
        });
    </script>
</body>
</html>
